# SLF4J Simple logging configuration.
#
# Lambda captures stdout/stderr into CloudWatch Logs and prepends its own
# timestamp + request id, so we keep the line compact and let CloudWatch add
# the timestamp.
org.slf4j.simpleLogger.logFile=System.out
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true

# Our application packages at INFO; quieten the chatty AWS SDK.
org.slf4j.simpleLogger.log.io.cb.strava=info
org.slf4j.simpleLogger.log.software.amazon.awssdk=warn
